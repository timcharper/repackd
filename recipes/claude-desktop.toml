# Claude Desktop for Linux: Anthropic's signed apt repo, repackaged as an RPM.
name    = "claude-desktop"
summary = "Claude Desktop (local repack of Anthropic's official .deb)"
license = "Proprietary"
url     = "https://code.claude.com/docs/en/desktop-linux"

[apt]
url       = "https://downloads.claude.ai/claude-desktop/apt/stable"
suite     = "stable"
component = "main"
package   = "claude-desktop"
key_url   = "https://downloads.claude.ai/claude-desktop/key.asc"
# Dearmored copy lives in /etc/repackd/keys (install.sh puts it there).
keyring   = "claude-desktop.gpg"
# install.sh refuses a key that doesn't match this (published in Anthropic's docs).
# Leave empty to trust on first use instead.
key_fingerprint = "31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"  # per code.claude.com/docs/en/desktop-linux

[build]
# Debian/Ubuntu-only files that mean nothing on Fedora.
strip        = ["etc/apt", "etc/apparmor.d", "usr/share/keyrings"]
setuid       = ["usr/lib/claude-desktop/chrome-sandbox"]
# Bundled Electron libs: not exported as Provides, not required from the system.
bundled_dir  = "usr/lib/claude-desktop"
# Cowork (agent VM): QEMU + UEFI + virtiofsd (x86_64 names; arm64 needs qemu-system-aarch64-core, edk2-aarch64).
# You also need to be in the kvm group (sudo usermod -aG kvm $USER).
recommends   = ["qemu-system-x86-core", "edk2-ovmf", "virtiofsd"]
# Extra regex alternatives for __requires_exclude, if autoreq misfires.
exclude_requires = []
# warn: log + save a diff when postinst/preinst/prerm/postrm change. block: refuse the update.
control_change = "warn"
# Newest RPMs kept for rollback; older ones are deleted on every build.
keep = 3
